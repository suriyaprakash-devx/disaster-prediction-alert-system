<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circular Plate with Glow Ring -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="url(#shieldBorder)" stroke-width="2.5" filter="url(#softGlow)"/>

  <!-- Radar Coordinates & Orbit Circles -->
  <circle cx="50" cy="50" r="37" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.45"/>
  <circle cx="50" cy="50" r="26" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.35"/>
  <circle cx="50" cy="50" r="15" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.4"/>
  <line x1="13" y1="50" x2="87" y2="50" stroke="#38bdf8" stroke-width="0.75" opacity="0.3"/>
  <line x1="50" y1="13" x2="50" y2="87" stroke="#38bdf8" stroke-width="0.75" opacity="0.3"/>

  <!-- Protective Early Warning Shield Emblem -->
  <path d="M 50 18 L 73 28 C 73 53 50 71 50 71 C 50 71 27 53 27 28 Z" 
        fill="rgba(15, 23, 42, 0.45)" 
        stroke="#ffffff" 
        stroke-width="2.6" 
        stroke-linejoin="round" 
        opacity="0.95"/>

  <!-- Real-Time Dynamic Wave / Seismic & Storm Pulse -->
  <path d="M 23 55 Q 33 42 43 54 T 63 46 T 77 50" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="2.4" 
        stroke-linecap="round"/>

  <!-- Central Early Warning AI Beacon -->
  <circle cx="50" cy="41" r="5" fill="#f59e0b" filter="url(#softGlow)"/>
  <circle cx="50" cy="41" r="2" fill="#ffffff"/>

  <!-- Orbiting Satellite Indicator -->
  <circle cx="68" cy="32" r="2" fill="#38bdf8" filter="url(#softGlow)"/>
  
  <!-- Cyclone / Emergency Swirl Accents -->
  <path d="M 43 36 C 45 32 55 32 57 37 C 59 42 53 47 48 45" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="1.6" 
        stroke-linecap="round" 
        opacity="0.85"/>
</svg>
